# Configuração Supabase CLI (desenvolvimento local: supabase start)
# Em produção (projeto na nuvem), copie os HTML de supabase/templates/ no painel:
# Authentication → Email Templates — ver supabase/email-templates.md

[auth.email]
enable_signup = true
# Obrigatório para enviar e-mail de confirmação e bloquear login sem confirmar
enable_confirmations = true

[auth.email.template.recovery]
subject = "Redefinir senha — SpecFlow"
content_path = "./templates/recovery.html"

[auth.email.template.confirmation]
subject = "Confirme o seu e-mail — SpecFlow"
content_path = "./templates/confirmation.html"

[auth.email.template.invite]
subject = "Convite para o SpecFlow"
content_path = "./templates/invite.html"

# Remetente exibido no Mailpit/Inbucket local
[inbucket]
sender_name = "SpecFlow"

# Com SMTP custom (local ou produção), use também:
# [auth.email.smtp]
# enabled = true
# host = "smtp.seudominio.com"
# port = 587
# user = "..."
# pass = "..."
# admin_email = "noreply@seudominio.com"
# sender_name = "SpecFlow"
