<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redefinir senha — SpecFlow</title>
</head>
<body style="margin:0;padding:0;background-color:#F1F5F9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#F1F5F9;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;">
          <tr>
            <td style="background:linear-gradient(135deg,#0F2460 0%,#1E3A8A 50%,#4C1D95 100%);border-radius:16px 16px 0 0;padding:28px 32px;text-align:center;">
              <img src="{{ .SiteURL }}/brand/specflow-landing-logo.png" alt="SpecFlow" width="160" height="48" style="display:block;margin:0 auto 12px;max-height:48px;width:auto;" />
              <p style="margin:0;color:#CBD5E1;font-size:14px;">Da ideia ao uso, sem ruído.</p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#ffffff;padding:32px;border-left:1px solid #E5E7EB;border-right:1px solid #E5E7EB;">
              <h1 style="margin:0 0 12px;font-size:22px;font-weight:700;color:#111827;">Redefinir senha</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#4B5563;">
                Recebemos um pedido para alterar a senha da conta <strong>{{ .Email }}</strong>.
                Clique no botão para escolher uma nova senha.
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 0 24px;">
                <tr>
                  <td style="border-radius:10px;background:linear-gradient(135deg,#1E3A8A,#4F46E5);">
                    <a href="{{ .ConfirmationURL }}" target="_blank" rel="noopener"
                      style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">
                      Redefinir senha
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:12px;line-height:1.5;word-break:break-all;color:#6B7280;">
                <a href="{{ .ConfirmationURL }}" style="color:#1D4ED8;">{{ .ConfirmationURL }}</a>
              </p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#F8FAFC;border:1px solid #E5E7EB;border-top:none;border-radius:0 0 16px 16px;padding:20px;text-align:center;">
              <p style="margin:0;font-size:12px;color:#9CA3AF;">Se não pediu esta alteração, ignore este e-mail.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
