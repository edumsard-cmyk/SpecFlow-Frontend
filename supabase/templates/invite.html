<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Convite SpecFlow</title>
</head>
<body style="margin:0;padding:0;background-color:#F1F5F9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#F1F5F9;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:520px;">
          <tr>
            <td style="background:linear-gradient(135deg,#0F2460,#1E3A8A,#4C1D95);border-radius:16px 16px 0 0;padding:28px 32px;text-align:center;">
              <img src="{{ .SiteURL }}/brand/specflow-landing-logo.png" alt="SpecFlow" width="160" style="display:block;margin:0 auto 12px;max-height:48px;" />
              <p style="margin:0;color:#CBD5E1;font-size:14px;">Da ideia ao uso, sem ruído.</p>
            </td>
          </tr>
          <tr>
            <td style="background:#fff;padding:32px;border:1px solid #E5E7EB;border-top:none;">
              <h1 style="margin:0 0 12px;font-size:22px;color:#111827;">Foi convidado para o SpecFlow</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#4B5563;">
                A sua equipa convidou-o para colaborar na plataforma. Aceite o convite para criar acesso com
                <strong>{{ .Email }}</strong>.
              </p>
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;background:linear-gradient(135deg,#1E3A8A,#4F46E5);color:#fff;font-weight:600;text-decoration:none;border-radius:10px;">
                Aceitar convite
              </a>
            </td>
          </tr>
          <tr>
            <td style="background:#F8FAFC;border:1px solid #E5E7EB;border-top:none;border-radius:0 0 16px 16px;padding:16px;text-align:center;font-size:12px;color:#9CA3AF;">
              SpecFlow — gestão de demandas
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
